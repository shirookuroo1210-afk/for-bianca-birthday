<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #wrap {
    position: relative;
  }
  canvas {
    display: block;
    max-width: 92vw;
    max-height: 92vh;
    border-radius: 12px;
  }
  #caption {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 15px;
    letter-spacing: 0.5px;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #replay {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.85);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #replay:hover {
    background: rgba(255,255,255,0.18);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="700" height="700"></canvas>
  <div id="caption">Happy Birthday Bii ❤</div>
  <button id="replay">Replay</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx = W / 2, cy = H / 2 + 40;

function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3) * scale;
  const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
  return [x, y];
}

function randRange(a, b) { return a + Math.random() * (b - a); }

function drawStroke(px, py, angle, length, r, g, b, width) {
  ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(cx + px, cy - py);
  ctx.lineTo(cx + px + length * Math.cos(angle), cy - (py + length * Math.sin(angle)));
  ctx.stroke();
}

let phase = 0;
let i = 0;
const PASS1_COUNT = 10000;
const PASS2_COUNT = 3500;
const STROKES_PER_FRAME = 40;

function frame() {
  if (phase === 0) {
    for (let k = 0; k < STROKES_PER_FRAME && i < PASS1_COUNT; k++, i++) {
      const t = randRange(0, 2 * Math.PI);
      const sc = randRange(0.5, 15.5);
      const [x, y] = heartPoint(t, sc);
      const ang = Math.atan2(y, x) + randRange(-0.5, 0.5);
      const length = randRange(4, 14);
      const g = Math.floor(randRange(0.25, 0.55) * 255);
      const b = Math.floor(randRange(0.65, 0.85) * 255);
      drawStroke(x, y, ang, length, 255, g, b, randRange(0.5, 1.2));
    }
    if (i >= PASS1_COUNT) { phase = 1; i = 0; }
    requestAnimationFrame(frame);
  } else if (phase === 1) {
    for (let k = 0; k < STROKES_PER_FRAME && i < PASS2_COUNT; k++, i++) {
      const t = randRange(0.2, 2 * Math.PI);
      const [x0, y0] = heartPoint(t, 16.0);
      const x = x0 + randRange(-2, 2);
      const y = y0 + randRange(-2, 2);
      const ang = Math.atan2(y0, x0) + randRange(-0.35, 0.35);
      const length = randRange(10, 32);
      const g = Math.floor(randRange(0.45, 0.75) * 255);
      const b = Math.floor(randRange(0.75, 0.95) * 255);
      drawStroke(x, y, ang, length, 255, g, b, randRange(0.4, 0.9));
    }
    if (i >= PASS2_COUNT) {
      phase = 2;
      document.getElementById('caption').style.opacity = 1;
      document.getElementById('replay').style.opacity = 1;
      return;
    }
    requestAnimationFrame(frame);
  }
}

function start() {
  ctx.clearRect(0, 0, W, H);
  document.getElementById('caption').style.opacity = 0;
  document.getElementById('replay').style.opacity = 0;
  phase = 0;
  i = 0;
  requestAnimationFrame(frame);
}

document.getElementById('replay').addEventListener('click', start);
start();
</script>
</body>
</html>
